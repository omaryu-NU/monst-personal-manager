name: Update Technophere catalog

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technophere-catalog-update
  cancel-in-progress: false

jobs:
  update:
    if: vars.TECHNOPHERE_REUSE_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog dependencies
        run: python -m pip install -r scripts/requirements-catalog.txt
      - name: Test catalog parser
        run: python -m unittest discover -s scripts -p "test_catalog_*.py"
      - name: Collect and verify catalog
        env:
          TECHNOPHERE_REUSE_APPROVED: 'true'
        run: python scripts/technophere_catalog.py --pages 5 --profiles 5 --delay 2.5
      # Phase 15: manual-only, read-only probe. Never edits catalog or evidence.
      - name: Phase 15 optional image candidate dry run
        if: github.event_name == 'workflow_dispatch' && vars.IMAGE_PROBE_DRY_RUN == 'true'
        env:
          TECHNOPHERE_REUSE_APPROVED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/catalog_image_backfill.py
          find public/catalog -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/catalog-before.sha256"
          python scripts/catalog_image_backfill.py public/catalog \
            --online-limit 3 --delay 4 \
            --state-file local-reports/image-backfill/actions-state.json \
            --output local-reports/image-backfill/actions-dry-run.json
          python scripts/catalog_image_probe_gate.py \
            local-reports/image-backfill/actions-dry-run.json \
            --max-attempts 3 --require-dry-run
          find public/catalog -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/catalog-after.sha256"
          diff -u "$RUNNER_TEMP/catalog-before.sha256" "$RUNNER_TEMP/catalog-after.sha256"
      - name: Upload Phase 15 image probe report
        if: always() && github.event_name == 'workflow_dispatch' && vars.IMAGE_PROBE_DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-image-probe-dry-run
          path: local-reports/image-backfill/actions-dry-run.json
          if-no-files-found: warn
          retention-days: 14
      # Phase 16 is opt-in. On schedule, enable only after a successful manual trial.
      # Restore evidence before selecting candidate URLs (avoids repeated probes).
      - name: Phase 16 verified image backfill and evidence registration
        if: vars.IMAGE_BACKFILL_ENABLED == 'true' && vars.IMAGE_PROBE_DRY_RUN != 'true' && (github.event_name == 'workflow_dispatch' || vars.IMAGE_BACKFILL_SCHEDULED == 'true')
        env:
          TECHNOPHERE_REUSE_APPROVED: 'true'
        run: |
          python scripts/catalog_image_auto.py \
            --catalog public/catalog \
            --evidence catalog-image-evidence.json \
            --state catalog-image-backfill-state.json \
            --limit 3 --delay 4 \
            --output local-reports/image-backfill/phase16-apply.json \
            --summary local-reports/image-backfill/phase16-summary.json
      - name: Upload Phase 16 image reports
        if: always() && vars.IMAGE_BACKFILL_ENABLED == 'true' && vars.IMAGE_PROBE_DRY_RUN != 'true' && (github.event_name == 'workflow_dispatch' || vars.IMAGE_BACKFILL_SCHEDULED == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: catalog-image-backfill-phase16
          path: |
            local-reports/image-backfill/phase16-apply.json
            local-reports/image-backfill/phase16-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Restore HTTP-verified catalog images
        run: |
          test -f catalog-image-evidence.json
          python scripts/catalog_image_evidence.py replay \
            --catalog public/catalog \
            --evidence catalog-image-evidence.json \
            --apply \
            --output local-reports/image-evidence/actions-replay.json
      - name: Upload image replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-image-replay-report
          path: local-reports/image-evidence/actions-replay.json
          if-no-files-found: warn
          retention-days: 14
      - name: Phase 14 image integration gate
        run: |
          python scripts/catalog_image_integration_audit.py \
            --catalog public/catalog \
            --evidence catalog-image-evidence.json \
            --min-evidence 1 \
            --strict \
            --output local-reports/image-integration/actions-report.json
      - name: Upload image integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-image-integration-report
          path: local-reports/image-integration/actions-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Audit local catalog
        run: python scripts/catalog_progress.py public/catalog --output catalog-audit-summary.json
      - name: Phase 5 catalog structural integrity gate
        run: python scripts/catalog_integrity.py public/catalog --output catalog-integrity-report
      - name: Upload catalog integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-integrity-report
          path: catalog-integrity-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit validated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog/manifest.json public/catalog/characters-*.json catalog-update-state.json catalog-coverage.json catalog-audit-summary.json
          # Commit the evidence and progress atomically with newly published URLs.
          git add catalog-image-evidence.json
          if [ -f catalog-image-backfill-state.json ]; then
            git add catalog-image-backfill-state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public monster catalog'
            git push
          fi
      - name: Set up Node.js for Hosting
        if: vars.AUTO_DEPLOY_HOSTING == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Firebase configuration
        if: vars.AUTO_DEPLOY_HOSTING == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for key in FIREBASE_PROJECT_ID FIREBASE_SERVICE_ACCOUNT VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required setting: $key" >&2
              exit 1
            fi
          done
          if [ "$FIREBASE_PROJECT_ID" != "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo 'Hosting project and web app project differ; refusing to deploy.' >&2
            exit 1
          fi
      - name: Build React app
        if: vars.AUTO_DEPLOY_HOSTING == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/catalog/manifest.json
      - name: Deploy Hosting only
        if: vars.AUTO_DEPLOY_HOSTING == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
